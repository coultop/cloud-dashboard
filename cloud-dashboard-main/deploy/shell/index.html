<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云电脑 · 云手机 统一控制台</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1b2530; --muted:#6b7a8c; --line:#e3e8ee; --ok:#12a05c; --bad:#d1495b; --accent:#1671c4; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  header { flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:9px 16px; flex-wrap:wrap;
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:650; letter-spacing:.3px; }
  .brand .logo { font-size:16px; }
  .tabs { display:flex; gap:4px; padding:3px; background:#eef2f7; border-radius:11px; }
  .tab { font:inherit; font-size:13px; display:flex; align-items:center; gap:7px; padding:6px 14px; border-radius:9px;
    border:1px solid transparent; background:transparent; color:#44566b; cursor:pointer; }
  .tab:hover { background:#e3ebf4; }
  .tab[aria-selected="true"] { background:var(--card); color:var(--text); border-color:var(--line);
    box-shadow:0 1px 3px rgba(20,40,60,.08); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#c3ccd6; flex:0 0 auto; }
  .dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(18,160,92,.15); }
  .dot.off { background:var(--bad); box-shadow:0 0 0 3px rgba(209,73,91,.15); }
  .spacer { flex:1 1 auto; }
  .health { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  button.reload { font:inherit; font-size:12.5px; border-radius:9px; border:1px solid var(--line); background:var(--card);
    color:var(--text); padding:6px 12px; cursor:pointer; }
  button.reload:hover { border-color:#c9d5e2; background:#f7fafd; }
  main { position:relative; flex:1 1 auto; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--card); }
  iframe[hidden] { display:none; }
  .fallback { padding:16px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">☁️</span><span>云电脑 · 云手机 统一控制台</span></div>
  <div class="tabs" role="tablist" aria-label="子应用">
    <button class="tab" id="tab-ctyun" type="button" role="tab" data-app="ctyun" aria-selected="true" aria-controls="pane-ctyun"><span class="dot" id="dot-ctyun"></span>云电脑</button>
    <button class="tab" id="tab-cmcc" type="button" role="tab" data-app="cmcc" aria-selected="false" aria-controls="pane-cmcc"><span class="dot" id="dot-cmcc"></span>云手机</button>
  </div>
  <div class="spacer"></div>
  <div class="health"><span class="dot" id="healthDot"></span><span id="healthText">检测中…</span></div>
  <button class="reload" id="reloadBtn" type="button">重载当前页</button>
</header>
<main>
  <noscript><div class="fallback">需要启用 JavaScript 才能内嵌两个子应用。</div></noscript>
  <iframe id="pane-ctyun" data-src="/ctyun/" title="云电脑" role="tabpanel" aria-labelledby="tab-ctyun"></iframe>
  <iframe id="pane-cmcc" data-src="/cmcc/" title="云手机" role="tabpanel" aria-labelledby="tab-cmcc" hidden></iframe>
</main>
<script>
(function () {
  'use strict';
  var TABS = ['ctyun', 'cmcc'];
  var DEFAULT_TAB = 'ctyun';
  var active = DEFAULT_TAB;

  function byId(id) { return document.getElementById(id); }

  function setDot(el, up) {
    if (!el) return;
    el.className = 'dot' + (up === true ? ' on' : up === false ? ' off' : '');
  }

  function activate(app) {
    if (TABS.indexOf(app) < 0) app = DEFAULT_TAB;
    active = app;
    TABS.forEach(function (name) {
      var selected = name === app;
      byId('tab-' + name).setAttribute('aria-selected', selected ? 'true' : 'false');
      var frame = byId('pane-' + name);
      if (selected && !frame.getAttribute('src')) frame.setAttribute('src', frame.getAttribute('data-src'));
      frame.hidden = !selected;
    });
  }

  function pollHealth() {
    fetch('/health', { cache: 'no-store' }).then(function (r) {
      return r.json();
    }).then(function (data) {
      var apps = (data && data.apps) || [];
      var allUp = apps.length > 0;
      apps.forEach(function (a) {
        setDot(byId('dot-' + a.name), a.up === true);
        if (a.up !== true) allUp = false;
      });
      setDot(byId('healthDot'), allUp);
      byId('healthText').textContent = allUp ? '全部在线' : '部分离线';
    }).catch(function () {
      setDot(byId('healthDot'), false);
      TABS.forEach(function (name) { setDot(byId('dot-' + name), false); });
      byId('healthText').textContent = '健康检查失败';
    });
  }

  TABS.forEach(function (name) {
    byId('tab-' + name).addEventListener('click', function () { activate(name); });
  });

  byId('reloadBtn').addEventListener('click', function () {
    var frame = byId('pane-' + active);
    if (!frame) return;
    try {
      frame.contentWindow.location.reload();
    } catch (e) {
      var src = frame.getAttribute('src');
      if (src) frame.setAttribute('src', src);
    }
  });

  activate(DEFAULT_TAB);
  pollHealth();
  setInterval(pollHealth, 15000);
})();
</script>
</body>
</html>
